name: Lore Codex review
run-name: 'Lore Codex review [${{ github.event.action }}] PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'lore:codex-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LORE_CLI_REPOSITORY: ${{ vars.LORE_CLI_REPOSITORY || 'treadiehq/lore' }}
      LORE_CLI_VERSION: ${{ vars.LORE_CLI_VERSION || 'v0.1.1' }}
    outputs:
      final-message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          path: review

      - name: Install Lore CLI
        run: |
          export LORE_REPO="$LORE_CLI_REPOSITORY"
          export LORE_VERSION="$LORE_CLI_VERSION"
          export LORE_BIN_DIR="$RUNNER_TEMP/lore/bin"
          curl -fsSL "https://raw.githubusercontent.com/$LORE_CLI_REPOSITORY/$LORE_CLI_VERSION/scripts/install.sh" | bash

      - name: Prepare Lore review context
        env:
          LORE_API_URL: ${{ vars.LORE_API_URL }}
          LORE_WORKSPACE_TOKEN: ${{ secrets.LORE_WORKSPACE_TOKEN }}
        run: >-
          lore github prepare-review
          --provider codex
          --event "$GITHUB_EVENT_PATH"
          --checkout "$GITHUB_WORKSPACE/review"
          --prompt-out "$GITHUB_WORKSPACE/.lore/codex-prompt.md"
          --metadata-out "$GITHUB_WORKSPACE/.lore/codex-metadata.json"
          --schema-out "$GITHUB_WORKSPACE/.lore/review-output.schema.json"

      - uses: actions/upload-artifact@v4
        with:
          name: lore-codex-metadata
          path: .lore/codex-metadata.json
          retention-days: 1

      - name: Run Codex
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .lore/codex-prompt.md
          output-schema-file: .lore/review-output.schema.json
          working-directory: review
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

  post:
    needs: review
    if: needs.review.outputs.final-message != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      LORE_CLI_REPOSITORY: ${{ vars.LORE_CLI_REPOSITORY || 'treadiehq/lore' }}
      LORE_CLI_VERSION: ${{ vars.LORE_CLI_VERSION || 'v0.1.1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: review

      - name: Install Lore CLI
        run: |
          export LORE_REPO="$LORE_CLI_REPOSITORY"
          export LORE_VERSION="$LORE_CLI_VERSION"
          export LORE_BIN_DIR="$RUNNER_TEMP/lore/bin"
          curl -fsSL "https://raw.githubusercontent.com/$LORE_CLI_REPOSITORY/$LORE_CLI_VERSION/scripts/install.sh" | bash

      - uses: actions/download-artifact@v4
        with:
          name: lore-codex-metadata
          path: .lore

      - name: Save review output
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.final-message }}
        run: |
          mkdir -p .lore
          printf '%s' "$CODEX_REVIEW" > .lore/codex-output.json

      - name: Post or update Lore review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          lore github post-review
          --metadata .lore/codex-metadata.json
          --output .lore/codex-output.json
