# The app name and primary region are intentionally supplied by flyctl.
# The helper replaces API_APP_NAME at deploy time. For a manual deployment,
# override both URL values with the real API app name.

[build]
  image = "ghcr.io/treadiehq/lore-web:0.1.5"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NITRO_HOST = "0.0.0.0"
  NITRO_PORT = "3000"
  NUXT_LORE_API_URL = "http://API_APP_NAME.internal:3001"
  NUXT_AUTH_COOKIE_NAME = "lore_session"
  NUXT_AUTH_COOKIE_SECURE = "true"
  NUXT_PUBLIC_API_BASE_URL = "/api/lore"
  NUXT_PUBLIC_LORE_CONNECTOR_API_URL = "https://API_APP_NAME.fly.dev"
  NUXT_PUBLIC_LORE_INSTALL_URL = "https://raw.githubusercontent.com/treadiehq/lore/main/scripts/install.sh"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
