# The app name and primary region are intentionally supplied by flyctl.
# deploy/fly/deploy.sh sets deployment-specific origins and workspace metadata.

[build]
  image = "ghcr.io/treadiehq/lore-api:0.1.5"

[deploy]
  release_command = "node node_modules/@lore-co/database/dist/migrate.js"
  release_command_timeout = "5m"

[env]
  NODE_ENV = "production"
  API_HOST = "::"
  API_PORT = "3001"
  API_JSON_BODY_LIMIT = "1mb"
  API_RATE_LIMIT_PER_MINUTE = "120"
  AUTH_MODE = "local_owner"
  AUTH_EMAIL_MODE = "disabled"
  AUTH_PASSWORD_RESET_TTL_MINUTES = "15"
  AUTH_SESSION_TTL_DAYS = "30"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/health/ready"
  timeout = "3s"

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
